<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用户管理测试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 100px; }
        input[type="text"], input[type="email"] { padding: 5px; width: 200px; }
        button { padding: 8px 15px; background: #007cba; color: white; border: none; cursor: pointer; }
        button:hover { background: #005a87; }
        .user-list { margin-top: 30px; }
        .user-item { padding: 5px 0; border-bottom: 1px solid #eee; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>用户管理测试</h1>

    <!-- 用户插入表单 -->
    <div>
        <h2>添加用户</h2>
        <form id="userForm">
            <div class="form-group">
                <label for="userName">用户名:</label>
                <input type="text" id="userName" name="userName" required>
            </div>
            <div class="form-group">
                <label for="email">邮箱:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">添加用户</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- 用户列表 -->
    <div class="user-list">
        <h2>用户列表</h2>
        <button onclick="loadUsers()">刷新列表</button>
        <div id="userList"></div>
    </div>

    <script>
        // 提交用户表单
        document.getElementById('userForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const userName = document.getElementById('userName').value;
            const email = document.getElementById('email').value;

            fetch('/user/insert', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `userName=${encodeURIComponent(userName)}&email=${encodeURIComponent(email)}`
            })
                .then(response => response.json()) // 解析JSON响应
                .then(result => {
                    if (result.success) {
                        document.getElementById('message').innerHTML = '<span class="success">用户添加成功!</span>';
                        document.getElementById('userForm').reset();
                        loadUsers(); // 添加成功后刷新列表
                    } else {
                        document.getElementById('message').innerHTML = '<span class="error">添加失败: ' + result.errorMsg + '</span>';
                    }
                })
                .catch(error => {
                    document.getElementById('message').innerHTML = '<span class="error">添加失败: ' + error.message + '</span>';
                });
        });

        // 加载用户列表
        function loadUsers() {
            fetch('/user/list')
                .then(response => response.json())
                .then(result => {
                    const listDiv = document.getElementById('userList');
                    if (result && result.data && result.data.length > 0) {
                        let html = '<div class="user-item"><strong>ID | 用户名 | 邮箱</strong></div>';
                        result.data.forEach(user => {
                            html += `<div class="user-item">${user.id} | ${user.userName} | ${user.email}</div>`;
                        });
                        listDiv.innerHTML = html;
                    } else {
                        listDiv.innerHTML = '<div>暂无用户数据</div>';
                    }
                })
                .catch(error => {
                    document.getElementById('userList').innerHTML = '<span class="error">加载失败: ' + error.message + '</span>';
                });
        }

        // 页面加载时自动获取用户列表
        window.onload = function () {
            loadUsers();
        };
    </script>

</body>
</html>
